[workspace]
default-members = ["crates/astrayn"]
members = ["crates/*"]
resolver = "2"

[workspace.package]
description = "Research code for Master's thesis on sampling large VMF mixture models in path guiding."
repository = "https://github.com/chrisliebaer/astrayn"
version = "0.1.0"
edition = "2021"
license = "NOASSERTION"
readme = "README.md"
categories = ["graphics", "rendering"]
keywords = ["rust-gpu", "path-guiding", "vmf", "mixture-models", "vulkan"]


[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
miette = { version = "7.0.0", features = ["fancy"] }
lazy_static = "1.4"
semver = "1.0"
enum-iterator = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


bevy_ecs = { version = "0.12", features = ["trace", "multi-threaded"] }
image = "0.24"
vulkano = "0.34.0"
vulkano-win = "0.34.0"
winit = "0.28"
rapier3d = "0.18.0"
egui = "0.24"
egui_plot = "0.24"
egui_winit_vulkano = "0.27.0"
exr = "1.72"
kahan = "0.1"
rayon = "1.10"
rfd = "0.14"
stacker = "0.1"

# needs to be in sync with shader builder
spirv-std = { git = "https://github.com/EmbarkStudios/rust-gpu", rev = "3689d11" }
bytemuck = { version = "1.14.1", features = ["derive", "min_const_generics"] }
glam = { version = "0.24", default-features = false, features = ["libm", "bytemuck"] }
shader = { path = "shader/shader", version = "0.1.0" }
pcg32 = "0.1"
approx = "0.5"
static_assertions = "1.1"


[patch.crates-io]
vulkano = { path = "../vulkano/vulkano" }


[profile.dev]
# perform basic optimizations in debug, we want to go fast
# opt-level = 1
